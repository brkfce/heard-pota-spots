# to set this config file, rename it so that it is called settings.ini and add a url to the webhook for the right channel in your discord server.
[config]
# the callsign of the RBN node closest to you
local_rbn = g4zfe
# whether you have chrome or firefox installed on the machine running the script as this used by selenium, "browser = chrome" or "browser = firefox"
browser = firefox
# discord webhook to a channel in your server; made in "Server Settings -> Integrations"
webhook = 
